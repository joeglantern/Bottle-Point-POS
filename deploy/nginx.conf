# Runs inside the bottle-point-web container (nginx:alpine).
# Host folder ~/apps/bottle-point is mounted at /srv, current -> releases/<id>

server {
    listen 80;
    server_name _;

    root /srv/current;
    index index.html;

    server_tokens off;
    disable_symlinks off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Note: no add_header inside locations, it would drop the headers above.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /brand/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
