# Runs inside the console container (nginx:alpine). Serves the company
# console on its own host and forwards only the console API. Nothing else of
# the API is reachable from here.

server {
    listen 80;
    server_name _;

    root /srv/current;
    index index.html;

    server_tokens off;
    disable_symlinks off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Note: no add_header inside locations, it would drop the headers above.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    location /api/console/ {
        proxy_pass http://api:3000;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # the shop API, sockets and M-Pesa callbacks do not exist on this host
    location /api/ { return 404; }
    location /socket.io/ { return 404; }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /brand/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        # fill in this address for link previews (see index.html)
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__ORIGIN__' 'https://$host';
        try_files $uri $uri/ /index.html;
    }
}
