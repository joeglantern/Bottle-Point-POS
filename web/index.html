<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f0e7" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bottle Point" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Point of sale for wines, spirits and local pubs." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Link previews (WhatsApp, Telegram, Slack, SMS). __ORIGIN__ is replaced by
         the server with this address, e.g. https://nyrolix.pos.flarehub.co.ke,
         because previews need full https links. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bottle Point" />
    <meta property="og:title" content="Bottle Point" />
    <meta property="og:description" content="Sign in to your shop. Point of sale for wines, spirits and local pubs." />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:image" content="__ORIGIN__/og-cover.png" />
    <meta property="og:image:secure_url" content="__ORIGIN__/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bottle Point" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bottle Point" />
    <meta name="twitter:description" content="Sign in to your shop. Point of sale for wines, spirits and local pubs." />
    <meta name="twitter:image" content="__ORIGIN__/og-cover.png" />
    <title>Bottle Point</title>
    <script>try{var t=localStorage.getItem("bp-theme");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
