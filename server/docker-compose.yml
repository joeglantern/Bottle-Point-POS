services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bottlepoint
      POSTGRES_PASSWORD: bottlepoint
      POSTGRES_DB: bottlepoint
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottlepoint"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
